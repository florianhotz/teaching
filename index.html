<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Informatik-Unterricht</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
:root { --bg: #edf0f5; --panel: #ffffff; --ink: #17233b; --muted: #5a6880; --line: #cdd5e0; --accent: #c47300; }
@media (prefers-color-scheme: dark) {
  :root { color-scheme: dark; --bg: #0f1626; --panel: #18223a; --ink: #e9eef7; --muted: #9ba8be; --line: #2f3c58; --accent: #f2a93b; }
}
body { margin: 0; background: var(--bg); color: var(--ink); font: 400 18px/1.5 "IBM Plex Sans", "Segoe UI", system-ui, sans-serif; }
main { max-width: 720px; margin: 0 auto; padding: 48px 20px; display: grid; gap: 20px; }
h1 { font: 700 34px/1.1 "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif; margin: 0; }
p { margin: 0; color: var(--muted); }
ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
a { display: block; background: var(--panel); border: 1px solid var(--line); border-left: 5px solid var(--accent); border-radius: 10px;
  padding: 16px 20px; color: var(--ink); text-decoration: none; }
a:hover, a:focus-visible { border-color: var(--ink); border-left-color: var(--accent); outline: none; }
a strong { display: block; font: 600 21px/1.2 "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif; }
a span { color: var(--muted); font-size: 16px; }
</style>
</head>
<body>
<main>
  <h1>Informatik-Unterricht</h1>
  <p>Interaktive Seiten für den Unterricht.</p>
  <ul>
    <li><a href="greedy-algorithmen/"><strong>Greedy-Algorithmen Schritt für Schritt</strong>
      <span>Münzen, Rucksack, Rundreise, Raumbelegung und Bergsteigen: je ein Beispiel, in dem Greedy optimal ist, und eines, in dem er scheitert.</span></a></li>
  </ul>
</main>
</body>
</html>
